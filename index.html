<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Schedule</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#0D0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schedule">

<!-- Splash screens so iOS shows the dark background instantly instead of a white flash on launch -->
<link rel="apple-touch-startup-image" href="apple-splash-1179-2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="apple-splash-1206-2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="apple-splash-1290-2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="apple-splash-1320-2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)">

<script>
// Standalone (home-screen) mode: fix the app height ONCE to the real screen height so there is
// never a black strip under the tab bar. Runs before first paint and never toggles afterwards.
(function(){
  var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!standalone) return;
  var h = Math.max(screen.height, screen.width);
  var root = document.documentElement;
  root.style.setProperty('--app-h', h + 'px');
  root.classList.add('tall');
})();
</script>
<style>
  :root{
    --paper:#0D0D0F;
    --card:#1C1C1F;
    --card-2:#232326;
    --ink:#ECECEC;
    --ink-soft:#8B8B90;
    --line:#28282C;
    --accent:#7C93E0;
    --accent-soft:#242B3E;
    --sage:#84B08B;
    --sage-soft:#1E2A20;
    --coral:#E08585;
    --coral-soft:#2E1F20;
    --amber:#E0B96A;
    --amber-soft:#2E2718;
    --radius:18px;
    --glass-bg: rgba(255,255,255,0.06);
    --glass-bg-strong: rgba(30,30,34,0.55);
    --glass-border: rgba(255,255,255,0.10);
    --glass-highlight: rgba(255,255,255,0.14);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    --nav-h: 62px;
    --nav-bottom: max(calc(var(--safe-bottom) - 14px), 2px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;}
  html{ color-scheme: dark; background:#0D0D0F; position:fixed; inset:0; width:100%; height:100%; overflow:hidden; }
  html,body{margin:0; padding:0; height:100%; width:100%; max-width:100%; overscroll-behavior:none; overflow:hidden; overflow-x:hidden; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column;
    position:fixed; inset:0; user-select:none;
  }

  /* iOS standalone sometimes reports a viewport shorter than the screen (black strip at the bottom).
     JS adds .tall and sets --app-h to the real screen height; everything is then positioned inside body. */
  html.tall, html.tall body{ position:absolute; top:0; left:0; right:auto; bottom:auto; width:100%; height:var(--app-h); }
  html.tall nav, html.tall .fab, html.tall .fade-bottom{ position:absolute; }
  input, textarea{ user-select:text; -webkit-user-select:text; }
  body::before{
    content:''; position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(circle at 12% 8%, rgba(124,147,224,0.32), transparent 42%),
      radial-gradient(circle at 90% 16%, rgba(224,133,133,0.20), transparent 40%),
      radial-gradient(circle at 26% 94%, rgba(132,176,139,0.22), transparent 45%),
      radial-gradient(circle at 92% 88%, rgba(224,185,106,0.16), transparent 40%),
      var(--paper);
  }
  h1,h2,h3{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight:700; letter-spacing:-0.3px; margin:0;}

  .top-pinned{ position:relative; z-index:5; }
  .hero{
    margin: 0 0 14px; padding: calc(14px + var(--safe-top)) 20px 16px;
    border-radius: 0 0 24px 24px;
    background: var(--glass-bg-strong);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border); border-top:none;
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 8px 24px rgba(0,0,0,0.3);
  }
  .hero-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .hero-greeting{font-size:22px; font-weight:700; color:var(--ink); letter-spacing:-0.3px;}
  .hero-date{font-size:12.5px; color:var(--ink-soft); margin-top:4px; text-transform:capitalize; font-weight:400;}
  .bell{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); cursor:pointer;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border:1px solid var(--glass-border);
  }
  .bell.on{ background:rgba(124,147,224,0.85); color:#0D0D0F; border-color:rgba(124,147,224,0.9); }

  .hero-status{
    margin-top:14px; display:flex; align-items:center; gap:11px;
    padding:12px 14px; border-radius:16px;
    background: rgba(255,255,255,0.05); border:1px solid var(--glass-border);
  }
  .hero-status .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; background:var(--ink-soft); }
  .hero-status.now .dot{ background:var(--sage); box-shadow:0 0 0 4px rgba(132,176,139,0.18); }
  .hero-status.next .dot{ background:var(--accent); box-shadow:0 0 0 4px rgba(124,147,224,0.16); }
  .hero-status .txt{ font-size:13.5px; line-height:1.4; color:var(--ink-soft); }
  .hero-status .txt b{ font-weight:600; color:var(--ink); }

  .hero-stats{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .hero-stat{
    font-size:12px; font-weight:500; color:var(--ink-soft);
    padding:6px 12px; border-radius:14px;
    background:rgba(255,255,255,0.05); border:1px solid var(--glass-border);
  }
  .hero-stat.due{ color:var(--coral); background:var(--coral-soft); border-color:rgba(224,133,133,0.3); }

  main{ flex:1; overflow-y:auto; overflow-x:hidden; padding: 0 16px calc(var(--nav-h) + var(--nav-bottom) + 6px); -webkit-overflow-scrolling:touch; }

  .fade-bottom{
    position:fixed; left:0; right:0; bottom:0; height: 90px;
    pointer-events:none; z-index:4;
    background: linear-gradient(to bottom, rgba(13,13,15,0) 0%, rgba(13,13,15,0.55) 22%, rgba(13,13,15,0.88) 52%, rgba(13,13,15,0.97) 100%);
  }
  .view{ display:none; }
  .view.active{ display:block; }

  .empty{
    text-align:center; color:var(--ink-soft); font-size:14px;
    padding: 48px 20px; line-height:1.6;
  }

  .card{
    border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px;
    display:flex; gap:12px; align-items:flex-start;
    cursor:pointer;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    transition: background .15s;
  }
  .card:active{ background: rgba(255,255,255,0.10); }
  .card .content{flex:1; min-width:0;}
  .card .title{font-size:15px; line-height:1.4; word-break:break-word; font-weight:400;}
  .card .meta{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .card .body{font-size:13.5px; color:var(--ink-soft); margin-top:5px; line-height:1.5; white-space:pre-wrap; word-break:break-word;}
  .card.done .title{ text-decoration: line-through; color:var(--ink-soft); }
  .del{
    border:none; background:none; color:var(--ink-soft); font-size:18px;
    width:26px; height:26px; flex-shrink:0; cursor:pointer; border-radius:8px;
  }
  .del:active{ background:rgba(255,255,255,0.12); }

  .prio-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:6px; }
  .prio-high{ background:var(--coral); }
  .prio-med{ background:var(--amber); }
  .prio-low{ background:var(--sage); }

  .check{
    width:22px; height:22px; border-radius:7px; border:1.5px solid var(--glass-border);
    flex-shrink:0; margin-top:2px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.04);
  }
  .check.done{ background:var(--sage); border-color:var(--sage); color:#12211a; font-size:14px; }

  .today-chip{
    display:block; width:100%; box-sizing:border-box; font-size:13px; color:var(--ink-soft); font-weight:500;
    padding:10px 16px; border-radius:16px;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .today-chip-accent{ color:var(--accent); border-color: rgba(124,147,224,0.4); background: rgba(124,147,224,0.16); }

  .grid-wrap{
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-radius:var(--radius);
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  table.sched{ border-collapse:collapse; width:100%; min-width:580px; }
  table.sched th, table.sched td{ border-bottom:1px solid var(--glass-border); border-right:1px solid var(--glass-border); vertical-align:top; }
  table.sched th:last-child, table.sched td:last-child{ border-right:none; }
  table.sched tr:last-child td{ border-bottom:none; }
  table.sched thead th{
    background:rgba(28,28,31,0.75); color:var(--ink-soft); font-size:11.5px; font-weight:400;
    padding:10px 6px; text-align:center; position:sticky; top:0; z-index:2;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  table.sched thead th.today{ color:var(--accent); background: rgba(124,147,224,0.22); font-weight:700; }
  table.sched th.timecol, table.sched td.timecol{
    position:sticky; left:0; z-index:1; background:rgba(28,28,31,0.75);
    width:54px; min-width:54px; text-align:center; padding:8px 4px;
    font-size:10.5px; color:var(--ink-soft); line-height:1.4;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  table.sched thead th.timecol{ z-index:3; }
  table.sched td.gcell{ min-width:104px; padding:7px; cursor:pointer; background:transparent; }
  table.sched td.gcell.today-col{ background: rgba(124,147,224,0.10); }
  table.sched td.gcell:active{ background:rgba(255,255,255,0.10); }
  .gitem{ margin-bottom:6px; }
  .gitem:last-child{ margin-bottom:0; }
  .gitem .gtitle{ font-size:12px; line-height:1.3; color:var(--ink); font-weight:400; }
  .gitem .groom{ font-size:10.5px; color:var(--ink-soft); margin-top:1px; }
  .gcell-plus{ color:var(--ink-soft); text-align:center; font-size:15px; opacity:0.3; }

  .slot-item{
    display:flex; gap:10px; align-items:flex-start;
    border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer;
    background: rgba(255,255,255,0.06); border:1px solid var(--glass-border);
  }
  .slot-item .content{ flex:1; min-width:0; }
  .del-inline{ border:none; background:none; color:var(--ink-soft); font-size:18px; width:24px; height:24px; cursor:pointer; flex-shrink:0; }


  .photo-btn{ border:none; background:none; color:var(--ink-soft); width:28px; height:24px; padding:0; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; opacity:.55; }
  .photo-btn.has{ color:#7C93E0; opacity:1; }
  .photo-btn svg{ width:20px; height:20px; }
  .photo-viewer{ position:absolute; inset:0; z-index:50; display:none; flex-direction:column; background:rgba(0,0,0,0.94); }
  .photo-viewer.open{ display:flex; }
  .photo-viewer .pv-x{ position:absolute; top:calc(var(--safe-top) + 10px); right:14px; z-index:2; border:none; background:rgba(255,255,255,0.16); color:#fff; width:40px; height:40px; border-radius:50%; font-size:24px; line-height:1; cursor:pointer; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .photo-viewer .pv-img{ position:absolute; left:0; right:0; top:calc(var(--safe-top) + 60px); bottom:calc(var(--safe-bottom) + 12px); overflow:hidden; }
  .photo-viewer .pv-img img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
  .photo-viewer .pv-img.zoom{ overflow:auto; -webkit-overflow-scrolling:touch; }
  .photo-viewer .pv-img.zoom img{ position:static; width:260%; height:auto; max-width:none; object-fit:initial; }

  .sched-header{
    z-index:4;
    margin: 0 0 10px; padding: 10px 12px 12px;
    border-radius: 20px;
    background: var(--glass-bg-strong);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 6px 18px rgba(0,0,0,0.22);
  }
  .sched-header.hidden{ display:none; }
  .day-tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .day-tab{
    flex:1; text-align:center; font-size:12.5px; font-weight:500; color:var(--ink-soft);
    padding:9px 4px; border-radius:14px; cursor:pointer;
    background: var(--glass-bg); border:1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  }
  .day-tab.is-today{ color:var(--accent); }
  .day-tab.active{ color:#0D0D0F; background: rgba(124,147,224,0.9); border-color: rgba(124,147,224,0.9); font-weight:700; }

  .chip-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .sched-header .chip-row{ margin-bottom:0; }
  .week-chip{
    display:block; width:100%; box-sizing:border-box; font-size:13px; color:var(--ink-soft); font-weight:500;
    padding:10px 16px; border-radius:16px;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .week-tag{ font-size:10.5px; font-weight:600; padding:1px 7px; border-radius:8px; margin-left:6px; vertical-align:middle; }
  .week-tag.this-week{ color:var(--accent); background: rgba(124,147,224,0.18); }
  .week-tag.other-week{ color:var(--ink-soft); background: rgba(255,255,255,0.06); }
  .gitem.faded{ opacity:0.45; }

  .day-slot{
    display:flex; gap:12px; align-items:flex-start;
    border-radius:var(--radius); padding:13px 14px; margin-bottom:9px; cursor:pointer;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    position:relative; transition: background .2s, border-color .2s;
  }
  .day-slot:active{ background: rgba(255,255,255,0.10); }
  .day-slot .timecol2{
    flex-shrink:0; width:56px; text-align:center; font-size:11px; color:var(--ink-soft); line-height:1.5; padding-top:1px;
  }
  .day-slot .slot-body{ flex:1; min-width:0; }
  .day-slot .gitem{ margin-bottom:6px; }
  .day-slot .gitem:last-child{ margin-bottom:0; }
  .day-slot .gtitle{ font-size:14.5px; line-height:1.4; color:var(--ink); }
  .day-slot .groom{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .day-slot.empty-slot .slot-body{ color:var(--ink-soft); font-size:13px; opacity:0.5; }

  .day-slot.now{
    background: var(--sage-soft);
    border-color: rgba(132,176,139,0.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 0 0 1px rgba(132,176,139,0.25);
  }
  .day-slot.now::before{
    content:''; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:3px;
    background:var(--sage);
  }
  .day-slot.now .timecol2{ color:var(--sage); }
  .day-slot.now .gtitle{ color:var(--ink); font-weight:600; }
  #view-schedule .day-slot:last-child{ margin-bottom: 32px; }

  /* ---- small-screen adaptivity (iPhone SE / mini and similar) ---- */
  @media (max-width: 380px){
    .hero{ padding: calc(12px + var(--safe-top)) 14px 13px; }
    .hero-greeting{ font-size:19px; }
    main{ padding-left:10px; padding-right:10px; }
    .day-tabs{ gap:4px; }
    .day-tab{ font-size:11px; padding:8px 2px; }
    .chip-row{ gap:6px; }
    .today-chip, .week-chip{ padding:7px 10px; font-size:11.5px; }
    .day-slot{ padding:11px 10px; gap:8px; }
    .day-slot .timecol2{ width:44px; font-size:10px; }
    .day-slot .gtitle{ font-size:13.5px; }
    .day-slot .groom{ font-size:11px; }
  }
  @media (max-width: 340px){
    .day-tab{ font-size:10px; }
    .day-slot .timecol2{ width:38px; font-size:9px; }
    .field input, .field select{ font-size:14px; padding:10px 10px; }
    .row2{ grid-template-columns:1fr; }
  }

  nav{
    position:fixed; left:0; right:0; bottom:0;
    border-radius:24px 24px 0 0; display:flex; padding: 6px 14px calc(4px + var(--nav-bottom)); z-index:6;
    background: rgba(24,24,27,0.88);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    border:1px solid var(--glass-border); border-bottom:none;
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 -6px 24px rgba(0,0,0,0.35);
  }
  nav::after{ content:''; position:absolute; left:-1px; right:-1px; top:100%; height:300px; background:rgba(24,24,27,0.98); pointer-events:none; }
  nav button{
    flex:1; background:none; border:none; display:flex; flex-direction:column;
    align-items:center; gap:4px; color:var(--ink-soft); font-size:11px; font-weight:500;
    padding:8px 0; cursor:pointer; font-family:inherit; border-radius:18px;
    transition: background .15s, color .15s;
  }
  nav button.active{ color:var(--accent); background:rgba(124,147,224,0.14); }
  nav svg{ width:21px; height:21px; }

  .fab{
    position:fixed; right:18px; bottom: calc(var(--nav-h) + var(--nav-bottom) + 14px);
    width:56px; height:56px; border-radius:50%;
    color:#0D0D0F; border:none; font-size:26px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:7;
    background: linear-gradient(160deg, rgba(160,178,235,0.95), rgba(124,147,224,0.85));
    border:1px solid rgba(255,255,255,0.35);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), 0 10px 24px rgba(124,147,224,0.45);
  }
  .fab:active{ transform:scale(0.94); }

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.45);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    display:none; align-items:flex-end; z-index:20; overflow-x:hidden;
    padding-bottom: var(--kb-inset, 0px);
    transition: padding-bottom .15s ease;
  }
  .sheet-backdrop.open{ display:flex; }
  .sheet{
    width:100%; max-width:100%; border-radius:26px 26px 0 0;
    padding: 12px 20px calc(20px + var(--safe-bottom));
    max-height:85vh; overflow-y:auto; overflow-x:hidden;
    background: rgba(24,24,27,0.82);
    -webkit-backdrop-filter: blur(34px) saturate(180%);
    backdrop-filter: blur(34px) saturate(180%);
    border:1px solid var(--glass-border); border-bottom:none;
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 -10px 30px rgba(0,0,0,0.4);
  }
  .sheet::before{
    content:''; display:block; width:36px; height:5px; border-radius:3px;
    background:rgba(255,255,255,0.22); margin:0 auto 16px;
  }
  .sheet h2{ font-size:18px; margin-bottom:14px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field textarea, .field select{
    box-sizing:border-box; width:100%; min-width:0; padding:11px 12px; border-radius:12px;
    font-size:15px; font-family:inherit; color:var(--ink);
    background: rgba(255,255,255,0.06); border:1px solid var(--glass-border);
    color-scheme: dark;
  }
  .field input[type="date"], .field input[type="time"]{
    -webkit-appearance:none; appearance:none;
    min-height:44px; line-height:1.2;
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; }
  .row2 .field{ width:100%; min-width:0; margin-bottom:0; }
  .row2 input{ width:100%; min-width:0; }
  .prio-choice{ display:flex; gap:8px; }
  .prio-choice button{

  .prio-choice button[data-p="med"].sel{ background:var(--amber-soft); color:var(--amber); border-color:var(--amber); }

  .a2hs{

    width:22px; height:22px; flex-shrink:0; cursor:pointer; border-radius:8px;
  }

  .toast{
    position:fixed; top: calc(14px + var(--safe-top)); left:50%; transform:translateX(-50%);
    color:var(--ink); padding:10px 18px; border-radius:20px;
    font-size:13.5px; z-index:30; opacity:0; pointer-events:none; transition:opacity .25s;
    background: rgba(30,30,34,0.75);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    border:1px solid var(--glass-border);
  }
  .toast.show{ opacity:1; }
</style>
</head>

<nav>

</div>

  <div class="pv-img" id="pvImg"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- storage ----------
const store = {
  get(key){ try{ return JSON.parse(localStorage.getItem(key)) || []; }catch(e){ return []; } },
  set(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const DAY_NAMES = ['Понедельник','Вторник','Среда','Четверг','Пятница'];
const DAY_SHORT = ['Пн','Вт','Ср','Чт','Пт'];
const SLOTS = [
  {start:'08:00', end:'09:30'},
  {start:'09:35', end:'11:05'},
  {start:'11:10', end:'12:40'},
  {start:'12:50', end:'14:20'},
  {start:'14:30', end:'16:00'},
  {start:'16:05', end:'17:35'},
];

// ---------- seed schedule (from uploaded timetable, with real week markers) ----------
// week: 0 = every week, 1 = only 1-неделя, 2 = only 2-неделя
const SEED_SCHEDULE_RAW = [
  {day:0, start:'08:00', end:'09:30', title:'ПС-262г', room:'006', week:1},
  {day:0, start:'09:35', end:'11:05', title:'МТ-251г', room:'209', week:1},
  {day:0, start:'11:10', end:'12:40', title:'ПО-242.1г', room:'404', week:0},
  {day:0, start:'14:30', end:'16:00', title:'БК-251.2/3г', room:'403', week:1},
  {day:0, start:'14:30', end:'16:00', title:'ВТ-252г', room:'416', week:2},
  {day:0, start:'16:05', end:'17:35', title:'ПО-252.2г', room:'406', week:0},

  {day:1, start:'09:35', end:'11:05', title:'ПО-252.1г', room:'407', week:1},
  {day:1, start:'11:10', end:'12:40', title:'БК-251.1г', room:'406', week:0},
  {day:1, start:'11:10', end:'12:40', title:'ПО-252.2г', room:'406', week:0},
  {day:1, start:'12:50', end:'14:20', title:'ПО-242.3г', room:'211', week:0},
  {day:1, start:'14:30', end:'16:00', title:'ВТ-252г', room:'416', week:0},
  {day:1, start:'16:05', end:'17:35', title:'ПО-242.2г', room:'405', week:0},

  {day:2, start:'09:35', end:'11:05', title:'ПИ-252.1г', room:'212', week:0},
  {day:2, start:'11:10', end:'12:40', title:'ПО-252.1г', room:'407', week:0},
  {day:2, start:'11:10', end:'12:40', title:'ПО-252.2г', room:'406', week:0},
  {day:2, start:'12:50', end:'14:20', title:'ПО-242.1г', room:'404', week:0},
  {day:2, start:'12:50', end:'14:20', title:'ПО-242.3г', room:'404', week:0},
  {day:2, start:'14:30', end:'16:00', title:'ПО-242.2г', room:'405', week:0},
  {day:2, start:'16:05', end:'17:35', title:'БК-251.2/3г', room:'403', week:0},

  {day:3, start:'08:00', end:'09:30', title:'ЕТ-251г', room:'122', week:1},
  {day:3, start:'09:35', end:'11:05', title:'ПО-242.1г', room:'404', week:0},
  {day:3, start:'11:10', end:'12:40', title:'ПО-242.3г', room:'211', week:0},
  {day:3, start:'14:30', end:'16:00', title:'ВТ-252г', room:'416', week:0},
  {day:3, start:'16:05', end:'17:35', title:'ПО-252.2г', room:'406', week:1},

  {day:4, start:'08:00', end:'09:30', title:'ПО-242.1г/МТ-251г', room:'404', week:0},
  {day:4, start:'11:10', end:'12:40', title:'ЕТ-251г', room:'122', week:0},
  {day:4, start:'12:50', end:'14:20', title:'ВТ-252г', room:'416', week:0},
  {day:4, start:'14:30', end:'16:00', title:'ПО-242.3г', room:'404', week:0},
  {day:4, start:'16:05', end:'17:35', title:'ПО-252.2г', room:'406', week:0},
];

let schedule, notes, tasks;
if(localStorage.getItem('schedule') === null){
  schedule = SEED_SCHEDULE_RAW.map(s => ({ id: uid(), ...s }));
  store.set('schedule', schedule);
} else {
  schedule = store.get('schedule').map(s => ({ week: 0, ...s }));
}
notes = store.get('notes');
tasks = store.get('tasks');

// ---------- helpers ----------
const $ = (sel) => document.querySelector(sel);
const pad = (n) => n.toString().padStart(2,'0');
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}
function fmtDate(d){
  return d.toLocaleDateString('ru-RU', { day:'numeric', month:'long', weekday:'long' });
}
function haptic(){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){} }
function ruPlural(n, one, few, many){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod10 === 1 && mod100 !== 11) return one;
  if(mod10 >= 2 && mod10 <= 4 && !(mod100 >= 12 && mod100 <= 14)) return few;
  return many;
}
function timeToMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
const USER_NAME = 'Жазира';
function greetingText(h){
  let base;
  if(h < 5) base = 'Доброй ночи';
  else if(h < 12) base = 'Доброе утро';
  else if(h < 18) base = 'Добрый день';
  else base = 'Добрый вечер';
  return `${base}, ${USER_NAME}`;
}
function todayDayIndex(){
  const js = new Date().getDay(); // 0=Sun..6=Sat
  return js >= 1 && js <= 5 ? js - 1 : -1;
}
// which day the schedule view is currently showing — defaults to today (or Monday on weekends)
let scheduleDay = todayDayIndex() === -1 ? 0 : todayDayIndex();

// ---------- academic week parity (1-я / 2-я неделя) ----------
// Anchored to the real university calendar (2026–2027 уч. год):
// the week of Mon 31 Aug 2026 is "I", and weeks simply alternate I/II every single
// week with no skips, all the way through the academic year.
function mondayOfWeek(d){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = dt.getUTCDay(); // 0=Sun..6=Sat
  const diffToMonday = day === 0 ? -6 : 1 - day;
  dt.setUTCDate(dt.getUTCDate() + diffToMonday);
  return dt;
}
function autoCurrentWeek(){
  const anchorMonday = new Date(Date.UTC(2026, 7, 31)); // Mon 31 Aug 2026 = week I
  const monday = mondayOfWeek(new Date());
  const daysDiff = Math.round((monday - anchorMonday) / 86400000);
  const weeksSinceAnchor = Math.floor(daysDiff / 7);
  const mod = ((weeksSinceAnchor % 2) + 2) % 2;
  return mod === 0 ? 1 : 2;
}
function currentWeek(){
  return autoCurrentWeek();
}
let viewWeek = null; // null = follow the real current week

// ---------- render: hero (replaces the old static header) ----------
function renderHero(){
  const now = new Date();
  const h = now.getHours();
  $('#heroGreeting').textContent = greetingText(h);
  $('#heroDate').textContent = fmtDate(now) + ' · ' + pad(h) + ':' + pad(now.getMinutes());

  const statusEl = $('#heroStatus');
  const today = todayDayIndex();
  let statusClass = 'free', html = '';

  if(today === -1){
    html = `<div class="dot"></div><div class="txt">Сегодня выходной — можно отдыхать 🌿</div>`;
  } else {
    const wk = currentWeek();
    const nowMin = h*60 + now.getMinutes();
    let current = null, next = null;
    for(const slot of SLOTS){
      const items = schedule.filter(s => s.day === today && s.start === slot.start && (s.week === 0 || s.week === wk));
      if(items.length === 0) continue;
      const sMin = timeToMinutes(slot.start), eMin = timeToMinutes(slot.end);
      if(nowMin >= sMin && nowMin < eMin){ current = { items, slot }; break; }
      if(!next && sMin > nowMin){ next = { items, slot }; }
    }
    if(current){
      statusClass = 'now';
      const names = current.items.map(i => i.title).join(', ');
      const leftMin = timeToMinutes(current.slot.end) - nowMin;
      html = `<div class="dot"></div><div class="txt">Сейчас: <b>${escapeHtml(names)}</b> · до ${current.slot.end} · ещё ${leftMin} мин</div>`;
    } else if(next){
      statusClass = 'next';
      const mins = timeToMinutes(next.slot.start) - nowMin;
      const names = next.items.map(i => i.title).join(', ');
      html = `<div class="dot"></div><div class="txt">Через ${mins} ${ruPlural(mins,'минуту','минуты','минут')}: <b>${escapeHtml(names)}</b></div>`;
    } else {
      html = `<div class="dot"></div><div class="txt">Пар больше нет — свободный вечер 🎧</div>`;
    }
  }
  statusEl.className = 'hero-status ' + statusClass;
  statusEl.innerHTML = html;

  const dueToday = tasks.filter(t => !t.completed && t.dueAt && new Date(t.dueAt).toDateString() === now.toDateString()).length;
  let stats = '';
  if(dueToday > 0) stats += `<div class="hero-stat due">⏰ ${dueToday} ${ruPlural(dueToday,'задача','задачи','задач')} на сегодня</div>`;
  $('#heroStats').innerHTML = stats;
}

// ---------- tabs ----------
const tabs = document.querySelectorAll('nav .tab');
const VIEW_ORDER = ['schedule', 'notes', 'tasks'];
let currentView = 'schedule';
function switchToView(name){
  tabs.forEach(b => b.classList.toggle('active', b.dataset.view === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  $('#schedHeader').classList.toggle('hidden', name !== 'schedule');
  currentView = name;
}
tabs.forEach(btn => btn.addEventListener('click', () => { haptic(); switchToView(btn.dataset.view); }));

// swipe left/right on the content to switch tabs, like a native app
(function(){
  const mainEl = document.querySelector('main');
  let sx = 0, sy = 0, tracking = false;
  mainEl.addEventListener('touchstart', (e) => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, { passive:true });
  mainEl.addEventListener('touchend', (e) => {
    if(!tracking) return; tracking = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) < 65 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    const idx = VIEW_ORDER.indexOf(currentView);
    if(dx < 0 && idx < VIEW_ORDER.length - 1){ haptic(); switchToView(VIEW_ORDER[idx+1]); }
    else if(dx > 0 && idx > 0){ haptic(); switchToView(VIEW_ORDER[idx-1]); }
  }, { passive:true });
})();

// ---------- group photos: files in ./photos/, mapped by group name ----------
// key = group name in lower case, value = path to the picture
const GROUP_PHOTOS = {
  'по-252.2г': 'photos/po-252-2g.jpg',
  'по-252.1г': 'photos/po-252-1g.jpg',
  'пи-252.1г': 'photos/pi-252-1g.jpg',
  'бк-251.1г': 'photos/bk-251-1g.jpg',
  'вт-252г': 'photos/vt-252g.jpg',
  'бк-251.2/3г': 'photos/bk-251-2-3g.jpg',
  'ет-251г': 'photos/et-251g.jpg',
  'пс-262г': 'photos/ps-262g.jpg',
  'по-242.3г': 'photos/po-242-3g.jpg',
  'по-242.1г': 'photos/po-242-1g.jpg',
  'по-242.1г/мт-251г': 'photos/po-242-1g.jpg',
  'по-242.2г': 'photos/po-242-2g.jpg',
};
const photoKey = t => String(t || '').trim().toLowerCase();
function showPhoto(key){
  const src = GROUP_PHOTOS[key];
  if(!src) return;
  $('#pvImg').innerHTML = '<img alt="">';
  const img = $('#pvImg img');
  img.onerror = () => { closePhoto(); toast('Фото не найдено: загрузи папку photos на сервер'); };
  img.src = src;
  $('#photoViewer').classList.add('open');
}
function closePhoto(){ $('#photoViewer').classList.remove('open'); $('#pvImg').classList.remove('zoom'); $('#pvImg').innerHTML = ''; }
$('#pvClose').onclick = closePhoto;
$('#pvImg').addEventListener('click', e => {
  if(e.target.tagName === 'IMG'){ $('#pvImg').classList.toggle('zoom'); return; }
  if(e.target.id === 'pvImg') closePhoto();
});
const PHOTO_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>';

// ---------- render: schedule (only the selected day, defaults to today) ----------
function renderSchedule(){
  const el = $('#view-schedule');
  const today = todayDayIndex();
  const now = new Date();

  const dayTabs = `<div class="day-tabs">${DAY_SHORT.map((n,i) => `
    <div class="day-tab${i===scheduleDay ? ' active' : ''}${i===today ? ' is-today' : ''}" data-day="${i}">${n}</div>`).join('')}</div>`;

  const wk = viewWeek || currentWeek();
  const isCur = wk === currentWeek();
  const weekChip = `<div class="week-chip" id="weekChip" style="cursor:pointer">${wk}-я неделя${isCur ? '' : ' · не текущая'} <span style="opacity:.6;float:right">⇄ ${wk === 1 ? 2 : 1}-я</span></div>`;

  let list = '';
  const nowMin = now.getHours()*60 + now.getMinutes();
  SLOTS.forEach((slot, si) => {
    const items = schedule.filter(s => s.day === scheduleDay && s.start === slot.start && (s.week === 0 || s.week === wk));
    const isNow = scheduleDay === today && nowMin >= timeToMinutes(slot.start) && nowMin < timeToMinutes(slot.end);
    const timecol = `<div class="timecol2">${si+1}<br>${slot.start}<br>${slot.end}</div>`;
    if(items.length === 0){
      list += `<div class="day-slot empty-slot${isNow ? ' now' : ''}" data-day="${scheduleDay}" data-slot="${si}">${timecol}<div class="slot-body">Нет пары · нажми, чтобы добавить</div></div>`;
    } else {
      const inner = items.map(it => {
        const weekTag = it.week ? `<span class="week-tag this-week">${it.week}-я нед.</span>` : '';
        return `<div class="gitem"><div class="gtitle">${escapeHtml(it.title)} ${weekTag}</div>${it.room ? `<div class="groom">ауд. ${escapeHtml(it.room)}</div>` : ''}</div>`;
      }).join('');
      list += `<div class="day-slot${isNow ? ' now' : ''}" data-day="${scheduleDay}" data-slot="${si}">${timecol}<div class="slot-body">${inner}</div></div>`;
    }
  });

  $('#schedHeader').innerHTML = `${dayTabs}<div class="chip-row">${weekChip}</div>`;
  el.innerHTML = list;

  $('#weekChip').addEventListener('click', () => {
    haptic();
    const next = (viewWeek || currentWeek()) === 1 ? 2 : 1;
    viewWeek = (next === currentWeek()) ? null : next;
    renderSchedule();
  });
  $('#schedHeader').querySelectorAll('.day-tab').forEach(tab => tab.addEventListener('click', () => {
    haptic();
    scheduleDay = Number(tab.dataset.day);
    renderSchedule();
  }));
}

function openSlotSheet(day, slotIdx){
  const slot = SLOTS[slotIdx];
  const items = schedule.filter(s => s.day === day && s.start === slot.start);
  if(items.length === 0){
    openEventForm(null, day, slot);
    return;
  }
  sheet.innerHTML = `<h2>${DAY_NAMES[day]}, ${slot.start}–${slot.end}</h2>` +
    items.map(it => `
      <div class="slot-item" data-id="${it.id}">
        <div class="content">
          <div class="title">${escapeHtml(it.title)}${it.week ? ` <span class="week-tag ${it.week===currentWeek() ? 'this-week' : 'other-week'}">${it.week}-я нед.</span>` : ''}</div>
          ${it.room ? `<div class="meta">ауд. ${escapeHtml(it.room)}</div>` : ''}
        </div>
        ${GROUP_PHOTOS[photoKey(it.title)] ? `<button class="photo-btn has" data-key="${escapeHtml(photoKey(it.title))}" aria-label="Фото">${PHOTO_ICON}</button>` : ''}
        <button class="del-inline" data-id="${it.id}">×</button>
      </div>`).join('') +
    `<div class="sheet-actions"><button class="btn btn-secondary" id="f-add-more">+ Добавить ещё</button></div>`;
  backdrop.classList.add('open');
  sheet.querySelectorAll('.slot-item').forEach(row => row.addEventListener('click', (e) => {
    if(e.target.closest('.del-inline') || e.target.closest('.photo-btn')) return;
    openEventForm(schedule.find(x => x.id === row.dataset.id), day, slot);
  }));
  sheet.querySelectorAll('.photo-btn').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation(); haptic();
    showPhoto(btn.dataset.key);
  }));
  sheet.querySelectorAll('.del-inline').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    schedule = schedule.filter(x => x.id !== btn.dataset.id);
    store.set('schedule', schedule); renderSchedule(); closeSheet();
  }));
  $('#f-add-more').onclick = () => openEventForm(null, day, slot);
}

// ---------- render: notes ----------
function renderNotes(){
  const el = $('#view-notes');
  const sorted = [...notes].sort((a,b) => b.updatedAt - a.updatedAt);
  if(sorted.length === 0){
    el.innerHTML = '<div class="empty">Заметок пока нет.<br>Нажми «+», чтобы написать первую.</div>';
    return;
  }
  el.innerHTML = sorted.map(n => `
    <div class="card" data-kind="notes" data-id="${n.id}">
      <div class="content">
        <div class="title">${escapeHtml(n.title || 'Без названия')}</div>
        ${n.body ? `<div class="body">${escapeHtml(n.body)}</div>` : ''}
      </div>
      <button class="del" data-kind="notes" data-id="${n.id}">×</button>
    </div>`).join('');
}

// ---------- render: tasks ----------
function renderTasks(){
  const el = $('#view-tasks');
  const sorted = [...tasks].sort((a,b) => {
    if(a.completed !== b.completed) return a.completed ? 1 : -1;
    return (a.dueAt||'').localeCompare(b.dueAt||'');
  });
  if(sorted.length === 0){
    el.innerHTML = '<div class="empty">Задач пока нет.<br>Нажми «+», чтобы добавить первую.</div>';
    return;
  }
  el.innerHTML = sorted.map(t => {
    const due = t.dueAt ? new Date(t.dueAt) : null;
    const dueStr = due ? due.toLocaleString('ru-RU', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
    return `
    <div class="card ${t.completed ? 'done' : ''}" data-kind="tasks" data-id="${t.id}">
      <div class="check ${t.completed ? 'done' : ''}" data-action="toggle" data-id="${t.id}">${t.completed ? '✓' : ''}</div>
      <span class="prio-dot prio-${t.priority}"></span>
      <div class="content">
        <div class="title">${escapeHtml(t.title)}</div>
        ${dueStr ? `<div class="meta">${dueStr}</div>` : ''}
      </div>
      <button class="del" data-kind="tasks" data-id="${t.id}">×</button>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderAll(){ renderHero(); renderSchedule(); renderNotes(); renderTasks(); }
renderAll();
setInterval(() => { renderHero(); if(currentView === 'schedule') renderSchedule(); }, 30000);

// ---------- click handling: delete / toggle / edit ----------
document.addEventListener('click', (e) => {
  const del = e.target.closest('.del');
  if(del){
    e.stopPropagation();
    const { kind, id } = del.dataset;
    if(kind === 'schedule'){ schedule = schedule.filter(x=>x.id!==id); store.set('schedule', schedule); renderSchedule(); }
    if(kind === 'notes'){ notes = notes.filter(x=>x.id!==id); store.set('notes', notes); renderNotes(); }
    if(kind === 'tasks'){ tasks = tasks.filter(x=>x.id!==id); store.set('tasks', tasks); renderTasks(); }
    return;
  }
  const check = e.target.closest('.check');
  if(check){
    e.stopPropagation();
    haptic();
    const id = check.dataset.id;
    tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
    store.set('tasks', tasks); renderTasks(); renderHero();
    return;
  }
  const card = e.target.closest('.card');
  if(card){
    const { kind, id } = card.dataset;
    if(kind === 'notes'){ openNoteForm(notes.find(x=>x.id===id)); }
    if(kind === 'tasks'){ openTaskForm(tasks.find(x=>x.id===id)); }
    return;
  }
  const daySlot = e.target.closest('.day-slot');
  if(daySlot){
    openSlotSheet(Number(daySlot.dataset.day), Number(daySlot.dataset.slot));
  }
});

// ---------- bottom sheet ----------
const backdrop = $('#sheetBackdrop');
const sheet = $('#sheet');
function closeSheet(){ backdrop.classList.remove('open'); sheet.innerHTML = ''; }
backdrop.addEventListener('click', (e) => { if(e.target === backdrop) closeSheet(); });

// keep the sheet above the on-screen keyboard in standalone iOS mode,
// where fixed-position elements don't otherwise account for it
if(window.visualViewport){
  const vv = window.visualViewport;
  function syncKeyboardInset(){
    const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb-inset', inset + 'px');
  }
  vv.addEventListener('resize', syncKeyboardInset);
  vv.addEventListener('scroll', syncKeyboardInset);
  syncKeyboardInset();
}

$('#fabBtn').addEventListener('click', () => {
  haptic();
  if(currentView === 'schedule') openEventForm(null, scheduleDay);
  else if(currentView === 'notes') openNoteForm();
  else openTaskForm();
});

function deleteBtnHtml(onclickFn){
  return `<button type="button" class="btn btn-danger" id="f-delete">Удалить</button>`;
}

function openEventForm(item, presetDay, presetSlot){
  const editing = !!item;
  const dDay = editing ? item.day : (presetDay !== undefined ? presetDay : todayDayIndex());
  const dStart = editing ? item.start : (presetSlot ? presetSlot.start : '09:00');
  const dEnd = editing ? item.end : (presetSlot ? presetSlot.end : '10:30');
  const dWeek = editing ? (item.week || 0) : 0;
  sheet.innerHTML = `
    <h2>${editing ? 'Изменить пару' : 'Новая пара'}</h2>
    <div class="field"><label>Предмет / группа</label><input id="f-title" type="text" value="${editing ? escapeHtml(item.title) : ''}" placeholder="Например, ПО-242.1г"></div>
    <div class="field"><label>День недели</label>
      <select id="f-day">
        ${DAY_NAMES.map((n,i) => `<option value="${i}" ${dDay===i ? 'selected' : ''}>${n}</option>`).join('')}
      </select>
    </div>
    <div class="row2">
      <div class="field"><label>Начало</label><input id="f-start" type="time" value="${dStart}"></div>
      <div class="field"><label>Конец</label><input id="f-end" type="time" value="${dEnd}"></div>
    </div>
    <div class="field"><label>Аудитория (необязательно)</label><input id="f-room" type="text" value="${editing ? escapeHtml(item.room||'') : ''}"></div>
    <div class="field"><label>Неделя</label>
      <select id="f-week">
        <option value="0" ${dWeek===0 ? 'selected' : ''}>Каждую неделю</option>
        <option value="1" ${dWeek===1 ? 'selected' : ''}>Только 1-я неделя</option>
        <option value="2" ${dWeek===2 ? 'selected' : ''}>Только 2-я неделя</option>
      </select>
    </div>
    <div class="sheet-actions">
      ${editing ? deleteBtnHtml() : '<button class="btn btn-secondary" id="f-cancel">Отмена</button>'}
      <button class="btn btn-primary" id="f-save">Сохранить</button>
    </div>`;
  backdrop.classList.add('open');
  if($('#f-cancel')) $('#f-cancel').onclick = closeSheet;
  if($('#f-delete')) $('#f-delete').onclick = () => {
    schedule = schedule.filter(x=>x.id!==item.id); store.set('schedule', schedule); renderSchedule(); renderHero(); closeSheet();
  };
  $('#f-save').onclick = () => {
    const title = $('#f-title').value.trim();
    if(!title){ toast('Введи предмет или группу'); return; }
    const data = { title, day: Number($('#f-day').value), start: $('#f-start').value, end: $('#f-end').value, room: $('#f-room').value.trim(), week: Number($('#f-week').value) };
    if(editing){
      schedule = schedule.map(x => x.id === item.id ? {...x, ...data} : x);
    } else {
      schedule.push({ id: uid(), ...data });
    }
    store.set('schedule', schedule); renderSchedule(); renderHero(); closeSheet();
  };
}

function openNoteForm(item){
  const editing = !!item;
  sheet.innerHTML = `
    <h2>${editing ? 'Изменить заметку' : 'Новая заметка'}</h2>
    <div class="field"><label>Заголовок</label><input id="f-title" type="text" value="${editing ? escapeHtml(item.title) : ''}"></div>
    <div class="field"><label>Текст</label><textarea id="f-body" rows="5">${editing ? escapeHtml(item.body) : ''}</textarea></div>
    <div class="sheet-actions">
      ${editing ? deleteBtnHtml() : '<button class="btn btn-secondary" id="f-cancel">Отмена</button>'}
      <button class="btn btn-primary" id="f-save">Сохранить</button>
    </div>`;
  backdrop.classList.add('open');
  if($('#f-cancel')) $('#f-cancel').onclick = closeSheet;
  if($('#f-delete')) $('#f-delete').onclick = () => {
    notes = notes.filter(x=>x.id!==item.id); store.set('notes', notes); renderNotes(); closeSheet();
  };
  $('#f-save').onclick = () => {
    const title = $('#f-title').value.trim();
    const body = $('#f-body').value.trim();
    if(!title && !body){ toast('Заметка пустая'); return; }
    if(editing){
      notes = notes.map(x => x.id === item.id ? {...x, title, body, updatedAt: Date.now()} : x);
    } else {
      notes.push({ id: uid(), title, body, updatedAt: Date.now() });
    }
    store.set('notes', notes); renderNotes(); closeSheet();
  };
}

function openTaskForm(item){
  const editing = !!item;
  let localDate, localTime;
  if(editing && item.dueAt){
    const d = new Date(item.dueAt);
    localDate = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    localTime = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } else {
    const now = new Date();
    now.setMinutes(now.getMinutes() + 30 - now.getMinutes()%30, 0, 0);
    localDate = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    localTime = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  }
  sheet.innerHTML = `
    <h2>${editing ? 'Изменить задачу' : 'Новая задача'}</h2>
    <div class="field"><label>Что нужно сделать</label><input id="f-title" type="text" value="${editing ? escapeHtml(item.title) : ''}"></div>
    <div class="field">
      <label>Срок (необязательно)</label>
      <div class="row2">
        <input id="f-due-date" type="date" value="${localDate}">
        <input id="f-due-time" type="time" value="${localTime}">
      </div>
    </div>
    <div class="field">
      <label>Приоритет</label>
      <div class="prio-choice">
        <button type="button" data-p="low" class="${(!editing && 'low'==='med') || (editing && item.priority==='low') ? 'sel' : ''}">Низкий</button>
        <button type="button" data-p="med" class="${(!editing) || (editing && item.priority==='med') ? 'sel' : ''}">Средний</button>
        <button type="button" data-p="high" class="${(editing && item.priority==='high') ? 'sel' : ''}">Высокий</button>
      </div>
    </div>
    <div class="sheet-actions">
      ${editing ? deleteBtnHtml() : '<button class="btn btn-secondary" id="f-cancel">Отмена</button>'}
      <button class="btn btn-primary" id="f-save">Сохранить</button>
    </div>`;
  backdrop.classList.add('open');
  let priority = editing ? item.priority : 'med';
  sheet.querySelectorAll('.prio-choice button').forEach(b => b.addEventListener('click', () => {
    sheet.querySelectorAll('.prio-choice button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); priority = b.dataset.p;
  }));
  if($('#f-cancel')) $('#f-cancel').onclick = closeSheet;
  if($('#f-delete')) $('#f-delete').onclick = () => {
    tasks = tasks.filter(x=>x.id!==item.id); store.set('tasks', tasks); renderTasks(); renderHero(); closeSheet();
  };
  $('#f-save').onclick = () => {
    const title = $('#f-title').value.trim();
    if(!title){ toast('Введи название задачи'); return; }
    const dueDateVal = $('#f-due-date').value;
    const dueTimeVal = $('#f-due-time').value || '00:00';
    const dueAt = dueDateVal ? new Date(`${dueDateVal}T${dueTimeVal}`).toISOString() : null;
    if(editing){
      tasks = tasks.map(x => x.id === item.id ? {...x, title, priority, dueAt, notified: (x.dueAt !== dueAt) ? false : x.notified} : x);
    } else {
      tasks.push({ id: uid(), title, priority, completed: false, notified: false, dueAt });
    }
    store.set('tasks', tasks); renderTasks(); renderHero(); closeSheet();
  };
}

// ---------- iOS home-screen / standalone detection ----------
// iOS Safari has no beforeinstallprompt, and Notification/Push only works
// once the app is actually added to the Home Screen (iOS 16.4+), so we
// detect both and steer the user accordingly instead of failing silently.
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS reports as Mac
const isStandalone = window.navigator.standalone === true ||
  window.matchMedia('(display-mode: standalone)').matches;

if(isIOS && !isStandalone && localStorage.getItem('a2hsDismissed') !== '1'){
  $('#a2hsBanner').classList.add('show');
}
$('#a2hsClose').addEventListener('click', () => {
  $('#a2hsBanner').classList.remove('show');
  localStorage.setItem('a2hsDismissed', '1');
});

// ---------- notifications ----------
let swReg = null;
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => { swReg = reg; }).catch(()=>{});
}
function updateBell(){
  const on = 'Notification' in window && Notification.permission === 'granted';
  $('#bellBtn').classList.toggle('on', on);
}
updateBell();
$('#bellBtn').addEventListener('click', async () => {
  if(isIOS && !isStandalone){
    toast('Сначала установи приложение: «Поделиться» → «На экран «Домой»»');
    $('#a2hsBanner').classList.add('show');
    return;
  }
  if(!('Notification' in window)){ toast('Уведомления не поддерживаются в этом браузере'); return; }
  if(Notification.permission === 'granted'){ toast('Уведомления уже включены'); return; }
  if(Notification.permission === 'denied'){ toast('Уведомления заблокированы в настройках'); return; }
  const perm = await Notification.requestPermission();
  updateBell();
  if(perm === 'granted') toast('Уведомления включены');
  else toast('Разрешение не выдано');
});

function notify(title, body){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  if(swReg && swReg.showNotification){
    swReg.showNotification(title, { body, icon: 'icon-192.png', badge: 'icon-192.png', vibrate: [80,40,80] });
  } else {
    new Notification(title, { body, icon: 'icon-192.png' });
  }
}

function checkDueTasks(){
  const now = Date.now();
  let changed = false;
  tasks = tasks.map(t => {
    if(!t.completed && !t.notified && t.dueAt){
      const due = new Date(t.dueAt).getTime();
      if(due <= now && now - due < 15*60*1000){
        notify('Пора: ' + t.title, t.dueAt ? new Date(t.dueAt).toLocaleString('ru-RU') : '');
        changed = true;
        return {...t, notified: true};
      }
    }
    return t;
  });
  if(changed){ store.set('tasks', tasks); if(currentView==='tasks') renderTasks(); }
}
setInterval(checkDueTasks, 20000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkDueTasks(); });
checkDueTasks();
</script>
